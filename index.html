<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Language Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 sm:p-5">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow border border-slate-200 p-4 sm:p-5 space-y-4">
    
    <div>
      <h1 class="text-lg font-bold text-slate-900">🌱 CI 言語学習アプリ</h1>
      <p class="text-xs text-slate-500">ステップ別生成：ストーリー ➔ 4コマ絵巻 ➔ ネイティブ音声</p>
    </div>

    <div id="msgBox" class="hidden p-3 rounded-lg text-xs font-mono leading-relaxed break-words whitespace-pre-wrap"></div>

    <!-- 学習設定 -->
    <div class="grid grid-cols-3 gap-2 text-xs">
      <div>
        <label class="block font-semibold text-slate-600 mb-1">言語</label>
        <select id="lang" onchange="updateVoiceOptions()" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="en-US" selected>英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="my-MM">ミャンマー語</option>
          <option value="es-ES">スペイン語</option>
          <option value="de-DE">ドイツ語</option>
          <option value="ko-KR">韓国語</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-600 mb-1">レベル</label>
        <select id="level" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="A1">入門 (A1)</option>
          <option value="A2">初級 (A2)</option>
          <option value="B1">中級 (B1)</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-600 mb-1">長さ</label>
        <select id="length" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="short">短め (4文構成)</option>
          <option value="medium" selected>標準 (6〜8文構成)</option>
          <option value="long">長め (10〜12文構成)</option>
        </select>
      </div>
    </div>

    <!-- テーマ入力 -->
    <div class="space-y-1">
      <input id="topic" type="text" placeholder="テーマ（例: カフェで注文、駅のホーム、雨の日の出来事）" class="w-full border border-slate-300 rounded p-2 text-xs">
    </div>

    <!-- 操作ボタンエリア（ストーリー生成 / イラスト生成） -->
    <div class="grid grid-cols-2 gap-2">
      <button id="storyBtn" onclick="runGenerateStory()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded text-xs transition shadow">
        📝 1. ストーリー作成
      </button>
      <button id="imgBtn" onclick="runGenerateImages()" disabled class="w-full bg-slate-300 text-slate-500 font-bold py-2.5 rounded text-xs cursor-not-allowed transition shadow">
        🎨 2. イラストを4枚生成
      </button>
    </div>

    <!-- ストーリー表示 -->
    <div class="space-y-1">
      <span class="text-xs font-semibold text-slate-600">生成ストーリー全文:</span>
      <textarea id="storyText" rows="4" class="w-full border border-slate-300 rounded p-2.5 text-xs leading-relaxed" placeholder="「1. ストーリー作成」を押すとここに文章が表示されます..."></textarea>
    </div>

    <!-- 4コマ画像表示 -->
    <div id="imgWrap" class="hidden space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-700">ストーリー絵巻 (4 Scenes):</span>
        <span id="engineBadge" class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded">Ready</span>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">1. 発端</span>
            <img id="sceneImg1" src="" alt="Scene 1" class="w-full h-full object-cover">
          </div>
          <p id="caption1" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">2. 展開</span>
            <img id="sceneImg2" src="" alt="Scene 2" class="w-full h-full object-cover">
          </div>
          <p id="caption2" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">3. クライマックス</span>
            <img id="sceneImg3" src="" alt="Scene 3" class="w-full h-full object-cover">
          </div>
          <p id="caption3" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">4. 結末</span>
            <img id="sceneImg4" src="" alt="Scene 4" class="w-full h-full object-cover">
          </div>
          <p id="caption4" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>
      </div>
    </div>

    <!-- 音声パネル -->
    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-2.5">
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">音声エンジン</label>
          <select id="ttsEngine" onchange="toggleVoiceSelect()" class="w-full border border-slate-300 rounded p-1.5 bg-white font-medium">
            <option value="elevenlabs" selected>ElevenLabs (肉声)</option>
            <option value="gcloud">Google Cloud TTS</option>
            <option value="browser">端末標準音声</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">再生速度</label>
          <select id="speechRate" class="w-full border border-slate-300 rounded p-1.5 bg-white">
            <option value="0.7">0.7x (超ゆっくり)</option>
            <option value="0.85">0.85x (ゆっくり)</option>
            <option value="1.0" selected>1.0x (標準)</option>
            <option value="1.15">1.15x (少し速め)</option>
            <option value="1.3">1.3x (高速)</option>
          </select>
        </div>
      </div>

      <!-- ElevenLabs専用 言語連動ボイス選択 -->
      <div id="voiceSelectWrap">
        <label class="block text-xs font-semibold text-indigo-900 mb-1">🎙 ナレーター声質:</label>
        <select id="voiceId" class="w-full border border-indigo-200 rounded p-1.5 text-xs bg-white text-indigo-950 font-semibold shadow-sm"></select>
      </div>

      <div class="flex gap-2">
        <button id="playBtn" onclick="runSpeech()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs transition shadow">
          ▶ 音声再生
        </button>
        <button onclick="stopAudio()" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium px-4 py-2 rounded text-xs transition">
          停止
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentAudio = null;
    let currentScenes = []; // ストーリー生成時に保持する絵コンテデータ

    const voiceMap = {
      "en-US": [
        { id: "pNInz6obpgDQGcFmaJgB", name: "Adam (米国・男性標準ナレーション)" },
        { id: "21m00Tcm4TlvDq8ikWAM", name: "Rachel (米国・女性クリア)" },
        { id: "VR6AewLTigWG4xSOukaG", name: "Arnold (米国・男性深み)" }
      ],
      "fr-FR": [
        { id: "JBFqnCBsd6RMkjVDRZzb", name: "Yves (フランス語・男性標準)" },
        { id: "piTKgcLEGmPE4e6mEKli", name: "Nicole (フランス語・女性やわらか)" }
      ],
      "zh-CN": [
        { id: "N2lVS1w4EtoT3dr4eOWO", name: "Callum (中国語・男性標準)" },
        { id: "pFZP5JQG7iQjIQuC4Bku", name: "Lily (中国語・女性クリア)" }
      ],
      "my-MM": [
        { id: "TX3LPaxmHKxFdv7VOQHJ", name: "Liam (ミャンマー語・中立ナレーション)" },
        { id: "EXAVITQu4vr4xnSDxMaL", name: "Bella (ミャンマー語・女性ナチュラル)" }
      ],
      "es-ES": [
        { id: "ErXwobaYiN019PkySvjV", name: "Antonio (スペイン語・男性クリア)" },
        { id: "EXAVITQu4vr4xnSDxMaL", name: "Bella (スペイン語・女性ナチュラル)" }
      ],
      "de-DE": [
        { id: "onwK4e9ZLuTAKqWW03F9", name: "Daniel (ドイツ語・男性標準)" },
        { id: "jBpfuIE2acCO8z3wKNLl", name: "Gigi (ドイツ語・女性)" }
      ],
      "ko-KR": [
        { id: "yoZ06aMxZJJ28mfd3POQ", name: "Sam (韓国語・男性)" },
        { id: "zrHiDhphv9ZnVXBqCLjz", name: "Mimi (韓国語・女性)" }
      ]
    };

    function updateVoiceOptions() {
      const lang = document.getElementById('lang').value;
      const voiceSelect = document.getElementById('voiceId');
      voiceSelect.innerHTML = '';

      const voices = voiceMap[lang] || voiceMap['en-US'];
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.innerText = v.name;
        voiceSelect.appendChild(opt);
      });
    }

    function toggleVoiceSelect() {
      const engine = document.getElementById('ttsEngine').value;
      const wrap = document.getElementById('voiceSelectWrap');
      if (engine === 'elevenlabs') {
        wrap.classList.remove('hidden');
      } else {
        wrap.classList.add('hidden');
      }
    }

    window.addEventListener('load', () => {
      updateVoiceOptions();
    });

    function showMsg(text, isError = false) {
      const box = document.getElementById('msgBox');
      if (!text) {
        box.classList.add('hidden');
        return;
      }
      box.innerText = text;
      box.className = `p-3 rounded-lg text-xs leading-relaxed break-words whitespace-pre-wrap ${
        isError ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'
      }`;
      box.classList.remove('hidden');
    }

    // 1. ストーリー作成処理
    async function runGenerateStory() {
      const storyBtn = document.getElementById('storyBtn');
      const imgBtn = document.getElementById('imgBtn');
      const langSelect = document.getElementById('lang');
      const targetLang = langSelect.options[langSelect.selectedIndex].text;
      const level = document.getElementById('level').value;
      const lengthChoice = document.getElementById('length').value;
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';

      storyBtn.disabled = true;
      storyBtn.innerText = '⏳ 作成中...';
      
      // 画像ボタンを一時無効化
      imgBtn.disabled = true;
      imgBtn.className = 'w-full bg-slate-300 text-slate-500 font-bold py-2.5 rounded text-xs cursor-not-allowed transition shadow';

      showMsg('Gemini でストーリー＆4シーン絵コンテを作成中...');

      try {
        const res = await fetch('/api/generate-story', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetLang, level, lengthChoice, topic })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'ストーリー生成に失敗しました');

        document.getElementById('storyText').value = data.story;
        currentScenes = data.scenes || [];

        // イラスト生成ボタンを活性化
        imgBtn.disabled = false;
        imgBtn.className = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded text-xs transition shadow';

        showMsg('✨ ストーリーが完成しました！「2. イラストを4枚生成」を押して描画できます。');
      } catch (err) {
        showMsg('【エラー】' + err.message, true);
      } finally {
        storyBtn.disabled = false;
        storyBtn.innerText = '📝 1. ストーリー再作成';
      }
    }

    // 2. イラスト画像作成処理
    async function runGenerateImages() {
      if (!currentScenes || currentScenes.length === 0) {
        showMsg('先に「1. ストーリー作成」を実行してください。', true);
        return;
      }

      const imgBtn = document.getElementById('imgBtn');
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';

      imgBtn.disabled = true;
      imgBtn.innerText = '⏳ 4枚描画中...';
      showMsg('4枚のシーンイラストを並列描画中...');
      document.getElementById('imgWrap').classList.remove('hidden');

      const fallbackCaptions = ["1. 発端", "2. 展開", "3. クライマックス", "4. 結末"];

      try {
        const loadTasks = [0, 1, 2, 3].map(async (i) => {
          const sc = currentScenes[i] || { caption: fallbackCaptions[i], prompt: `${topic}, scene ${i + 1}` };
          document.getElementById(`caption${i + 1}`).innerText = sc.caption;

          const imgRes = await fetch('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: sc.prompt, index: i })
          });

          const imgData = await imgRes.json();
          if (imgData.url) {
            document.getElementById(`sceneImg${i + 1}`).src = imgData.url;
            document.getElementById('engineBadge').innerText = imgData.engine;
          }
        });

        await Promise.all(loadTasks);
        showMsg('');
      } catch (err) {
        showMsg('【画像生成エラー】' + err.message, true);
      } finally {
        imgBtn.disabled = false;
        imgBtn.innerText = '🎨 2. イラスト再生成';
      }
    }

    // 3. 音声再生処理
    async function runSpeech() {
      const text = document.getElementById('storyText').value.trim();
      if (!text) return showMsg('先にストーリーを作成してください。', true);

      stopAudio();
      const engine = document.getElementById('ttsEngine').value;
      const langCode = document.getElementById('lang').value;
      const voiceId = document.getElementById('voiceId').value;
      const rate = parseFloat(document.getElementById('speechRate').value);
      const playBtn = document.getElementById('playBtn');

      playBtn.disabled = true;
      playBtn.innerText = '⏳ 準備中...';

      try {
        if (engine === 'browser') {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = langCode;
          u.rate = rate;
          const voices = window.speechSynthesis.getVoices();
          const match = voices.find(v => v.lang === langCode || v.lang.startsWith(langCode.split('-')[0]));
          if (match) u.voice = match;
          window.speechSynthesis.speak(u);
          playBtn.disabled = false;
          playBtn.innerText = '▶ 音声再生';
          return;
        }

        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, engine, voiceId, langCode, rate })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `音声エラー (${res.status})`);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        currentAudio.playbackRate = (engine === 'elevenlabs') ? rate : 1.0;
        currentAudio.onended = () => URL.revokeObjectURL(url);
        await currentAudio.play();

      } catch (err) {
        showMsg('【音声エラー】' + err.message + '\n※端末標準音声で再生します。', true);
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langCode;
        u.rate = rate;
        window.speechSynthesis.speak(u);
      } finally {
        playBtn.disabled = false;
        playBtn.innerText = '▶ 音声再生';
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
