<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Language Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
    <h1 class="text-xl font-bold text-slate-900 mb-1">🌱 CI 言語学習アプリ</h1>
    <p class="text-xs text-slate-500 mb-4">Gemini 3.6 Flash × 速度調整付き音声</p>

    <!-- APIキー入力 -->
    <div class="mb-4">
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-600">Gemini API Key:</label>
        <span id="keySavedStatus" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済み</span>
      </div>
      <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p class="text-[10px] text-slate-400 mt-1">※キーはお使いの端末にのみ安全に保存されます</p>
    </div>

    <!-- 設定 -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">学習言語:</label>
        <select id="lang" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="en-US">英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="es-ES">スペイン語</option>
          <option value="de-DE">ドイツ語</option>
          <option value="ko-KR">韓国語</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">レベル:</label>
        <select id="level" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="A1 (入門・超基礎)">入門 (A1)</option>
          <option value="A2 (初級・日常)">初級 (A2)</option>
          <option value="B1 (中級)">中級 (B1)</option>
        </select>
      </div>
    </div>

    <!-- テーマ入力 & 生成ボタン -->
    <div class="mb-4">
      <input id="topic" type="text" placeholder="テーマ（例: 朝のコーヒー、公園の散歩）" class="w-full border border-slate-300 rounded-lg p-2 text-xs mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="generateContent()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-2">
        <span>✨</span> AIストーリーを生成
      </button>
    </div>

    <!-- エラー表示エリア -->
    <div id="errorBox" class="hidden mb-3 p-3 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-700 leading-relaxed break-words whitespace-pre-wrap"></div>

    <!-- 結果テキスト -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-600 mb-1">生成されたストーリー:</label>
      <textarea id="resultText" rows="5" class="w-full border border-slate-300 rounded-lg p-3 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans" placeholder="ここにストーリーが表示されます..."></textarea>
    </div>

    <!-- 音声再生＆速度コントロールパネル -->
    <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-3 mb-2">
      <div class="flex items-center justify-between gap-2 mb-3">
        <span class="text-xs font-bold text-indigo-900 flex items-center gap-1">
          <span>⚡</span> 再生速度:
        </span>
        <select id="speechRate" class="border border-indigo-200 rounded-lg px-2.5 py-1.5 text-xs bg-white text-slate-800 font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="0.7">0.7x (超ゆっくり)</option>
          <option value="0.85">0.85x (ゆっくり・練習用)</option>
          <option value="1.0" selected>1.0x (標準スピード)</option>
          <option value="1.15">1.15x (少し速め)</option>
          <option value="1.3">1.3x (高速)</option>
        </select>
      </div>

      <div class="flex gap-2">
        <button onclick="speakText()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-1 shadow-sm">
          <span>▶</span> 音声再生
        </button>
        <button onclick="stopSpeech()" class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium px-4 py-2.5 rounded-lg text-xs transition shadow-sm">
          停止
        </button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('ci_gemini_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keySavedStatus').classList.remove('hidden');
      }
    });

    async function generateContent() {
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      errorBox.innerText = '';

      let rawKey = document.getElementById('apiKey').value;
      const apiKey = rawKey.trim().replace(/^["']|["']$/g, '');

      if (!apiKey) {
        showError('APIキーが入力されていません。「AIzaSy...」で始まるキーを入力してください。');
        return;
      }

      localStorage.setItem('ci_gemini_key', apiKey);
      document.getElementById('keySavedStatus').classList.remove('hidden');

      const langSelect = document.getElementById('lang');
      const targetLang = langSelect.options[langSelect.selectedIndex].text;
      const level = document.getElementById('level').value;
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';
      const btn = document.getElementById('genBtn');

      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin">⏳</span> 生成中...';

      const prompt = `あなたは第二言語習得論（CI: Comprehensible Input）の専門家です。
学習者が日本語を介さず情景をイメージしながら直感的に理解できる文章を作成してください。

【条件】
1. 言語: ${targetLang}
2. レベル: ${level}（極めて平易で文脈から意味が推測できる単語・文構造）
3. テーマ: ${topic}
4. 出力ルール:
   - 全体で60〜100語程度の短いパラグラフ
   - 日本語の訳や解説、挨拶は一切書かず、ターゲット言語のテキストのみを出力してください`;

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();

        if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
          document.getElementById('resultText').value = data.candidates[0].content.parts[0].text.trim();
        } else if (data.error) {
          throw new Error(`[${data.error.status || res.status}] ${data.error.message}`);
        } else {
          throw new Error('AIからテキストを受け取れませんでした。もう一度お試しください。');
        }
      } catch (err) {
        showError(`【エラー詳細】\n${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>✨</span> AIストーリーを生成';
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    function speakText() {
      const text = document.getElementById('resultText').value.trim();
      if (!text) return alert('先にテキストを生成するか、文章を入力してください');
      
      window.speechSynthesis.cancel();
      
      const u = new SpeechSynthesisUtterance(text);
      u.lang = document.getElementById('lang').value;
      
      const rateElem = document.getElementById('speechRate');
      u.rate = rateElem ? parseFloat(rateElem.value) : 1.0;
      
      window.speechSynthesis.speak(u);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
