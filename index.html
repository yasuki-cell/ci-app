<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Language Assistant</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>
    // エラーが起きたら即座に画面最上部へ赤文字で強制表示する安全装置
    window.onerror = function(msg, url, line) {
      const box = document.getElementById('errorBox');
      if (box) {
        box.innerText = '【実行時エラー】' + msg + ' (行: ' + line + ')';
        box.classList.remove('hidden');
      }
      return false;
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
    <h1 class="text-xl font-bold text-slate-900 mb-1">🌱 CI 言語学習アプリ</h1>
    <p class="text-xs text-slate-500 mb-4">Gemini × 高精細イラスト × ネイティブ音声</p>

    <!-- エラー表示ボックス -->
    <div id="errorBox" class="hidden mb-3 p-3 bg-rose-50 border-2 border-rose-300 rounded-lg text-xs text-rose-700 leading-relaxed break-words whitespace-pre-wrap font-mono font-bold"></div>

    <!-- 進行状況ステータス表示 -->
    <div id="statusBox" class="hidden mb-3 p-2 bg-indigo-50 border border-indigo-200 rounded-lg text-xs text-indigo-700 font-semibold text-center"></div>

    <!-- API設定エリア -->
    <details class="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs" open>
      <summary class="font-semibold text-slate-700 cursor-pointer select-none">
        ⚙️ API・接続設定（クリックで開閉）
      </summary>
      <div class="space-y-2 mt-3 pt-2 border-t border-slate-200">
        <!-- Gemini -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">1. Gemini API Key (文章生成・必須):</label>
            <span id="geminiSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Hugging Face -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">2. Hugging Face Token (画像生成・任意):</label>
            <span id="hfSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="hfToken" type="password" placeholder="hf_..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Google Cloud Functions URL -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">3. Google TTS サーバーURL (任意):</label>
            <span id="gFuncSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="gFuncUrl" type="url" placeholder="[https://asia-northeast1-...cloudfunctions.net/tts](https://asia-northeast1-...cloudfunctions.net/tts)" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- ElevenLabs -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">4. ElevenLabs API Key (肉声音声・任意):</label>
            <span id="elevenSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="elevenKey" type="password" placeholder="sk_..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
    </details>

    <!-- 設定 -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">言語:</label>
        <select id="lang" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="en-US">英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="my-MM">ミャンマー語</option>
          <option value="es-ES">スペイン語</option>
          <option value="de-DE">ドイツ語</option>
          <option value="ko-KR">韓国語</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">レベル:</label>
        <select id="level" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="A1 (入門・超基礎)">入門 (A1)</option>
          <option value="A2 (初級・日常)">初級 (A2)</option>
          <option value="B1 (中級)">中級 (B1)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">長さ:</label>
        <select id="length" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 font-medium">
          <option value="short">短め (30〜50語)</option>
          <option value="medium" selected>標準 (60〜100語)</option>
          <option value="long">長め (120〜150語)</option>
        </select>
      </div>
    </div>

    <!-- テーマ入力 & 生成ボタン -->
    <div class="mb-4">
      <input id="topic" type="text" placeholder="テーマ（例: カフェで注文、駅のホーム、雨の街）" class="w-full border border-slate-300 rounded-lg p-2 text-xs mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="genBtn" onclick="startGeneration()" type="button" class="w-full bg-indigo-600 active:bg-indigo-800 text-white font-bold py-3 rounded-lg text-xs transition flex justify-center items-center gap-2 shadow-sm touch-manipulation cursor-pointer">
        <span>✨</span> ストーリー＆情景イラストを生成
      </button>
    </div>

    <!-- 生成されたイラスト画像 -->
    <div id="imageContainer" class="hidden mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-1">作画カット (Visual Context):</label>
      <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-xl overflow-hidden border border-slate-200 shadow-sm flex items-center justify-center">
        <img id="generatedImage" src="" alt="情景イラスト" class="w-full h-full object-cover">
      </div>
    </div>

    <!-- 結果テキスト -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-600 mb-1">生成されたストーリー:</label>
      <textarea id="resultText" rows="4" class="w-full border border-slate-300 rounded-lg p-3 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans" placeholder="ここにストーリーが表示されます..."></textarea>
    </div>

    <!-- 音声エンジン選択＆コントロール -->
    <div class="bg-indigo-50/70 border border-indigo-100 rounded-xl p-3 mb-2 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold text-indigo-900 mb-1">🎙 音声エンジン:</label>
          <select id="ttsEngine" class="w-full border border-indigo-200 rounded-lg p-1.5 text-xs bg-white text-slate-800 font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="browser" selected>端末ネイティブ音声 (安定・無料)</option>
            <option value="gfunc">Google Cloud TTS (サーバー連携)</option>
            <option value="elevenlabs">ElevenLabs (最高峰肉声)</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-indigo-900 mb-1">⚡ 再生速度:</label>
          <select id="speechRate" class="w-full border border-indigo-200 rounded-lg p-1.5 text-xs bg-white text-slate-800 font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="0.7">0.7x (超ゆっくり)</option>
            <option value="0.85">0.85x (ゆっくり・練習用)</option>
            <option value="1.0" selected>1.0x (標準スピード)</option>
            <option value="1.15">1.15x (少し速め)</option>
            <option value="1.3">1.3x (高速)</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="playBtn" onclick="handleSpeak()" type="button" class="flex-1 bg-emerald-600 active:bg-emerald-800 text-white font-bold py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-1 shadow-sm touch-manipulation cursor-pointer">
          <span>▶</span> 音声再生
        </button>
        <button onclick="stopSpeech()" type="button" class="bg-white border border-slate-200 active:bg-slate-100 text-slate-700 font-medium px-4 py-2.5 rounded-lg text-xs transition shadow-sm touch-manipulation">
          停止
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeAudio = null;

    // ロード時に保存キーを展開
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const savedGemini = localStorage.getItem('ci_gemini_key');
        if (savedGemini) {
          document.getElementById('apiKey').value = savedGemini;
          document.getElementById('geminiSaved').classList.remove('hidden');
        }
        const savedHf = localStorage.getItem('ci_hf_token');
        if (savedHf) {
          document.getElementById('hfToken').value = savedHf;
          document.getElementById('hfSaved').classList.remove('hidden');
        }
        const savedGFunc = localStorage.getItem('ci_gfunc_url');
        if (savedGFunc) {
          document.getElementById('gFuncUrl').value = savedGFunc;
          document.getElementById('gFuncSaved').classList.remove('hidden');
        }
        const savedEleven = localStorage.getItem('ci_eleven_key');
        if (savedEleven) {
          document.getElementById('elevenKey').value = savedEleven;
          document.getElementById('elevenSaved').classList.remove('hidden');
        }
      } catch (e) {
        console.error(e);
      }
    });

    function setStatus(text) {
      const statusBox = document.getElementById('statusBox');
      if (text) {
        statusBox.innerText = text;
        statusBox.classList.remove('hidden');
      } else {
        statusBox.classList.add('hidden');
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
      setStatus('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ボタンタップで即座に同期実行される関数
    async function startGeneration() {
      const btn = document.getElementById('genBtn');
      const errorBox = document.getElementById('errorBox');
      const imgContainer = document.getElementById('imageContainer');
      const imgElem = document.getElementById('generatedImage');

      // 画面を即座に処理中状態へ更新（タップフィードバック）
      errorBox.classList.add('hidden');
      errorBox.innerText = '';
      imgContainer.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin">⏳</span> シーン設計中...';
      setStatus('Gemini API へ接続しています...');

      try {
        const apiKey = document.getElementById('apiKey').value.trim().replace(/^["']|["']$/g, '');
        const hfToken = document.getElementById('hfToken').value.trim().replace(/^["']|["']$/g, '');
        const gFuncUrl = document.getElementById('gFuncUrl').value.trim();
        const elevenKey = document.getElementById('elevenKey').value.trim().replace(/^["']|["']$/g, '');

        if (!apiKey) {
          throw new Error('Gemini APIキーが未入力です。「⚙️ API・接続設定」に AIzaSy... で始まるキーを入力してください。');
        }

        localStorage.setItem('ci_gemini_key', apiKey);
        document.getElementById('geminiSaved').classList.remove('hidden');

        if (hfToken) {
          localStorage.setItem('ci_hf_token', hfToken);
          document.getElementById('hfSaved').classList.remove('hidden');
        }
        if (gFuncUrl) {
          localStorage.setItem('ci_gfunc_url', gFuncUrl);
          document.getElementById('gFuncSaved').classList.remove('hidden');
        }
        if (elevenKey) {
          localStorage.setItem('ci_eleven_key', elevenKey);
          document.getElementById('elevenSaved').classList.remove('hidden');
        }

        const langSelect = document.getElementById('lang');
        const targetLang = langSelect.options[langSelect.selectedIndex].text;
        const level = document.getElementById('level').value;
        const lengthChoice = document.getElementById('length').value;
        const topic = document.getElementById('topic').value.trim() || '日常の出来事';

        let lengthPrompt = '全体で60〜100語程度の標準的なパラグラフ';
        if (lengthChoice === 'short') lengthPrompt = '全体で30〜50語程度（2〜3文）の非常に短いパラグラフ';
        if (lengthChoice === 'long') lengthPrompt = '全体で120〜150語程度のしっかりとしたパラグラフ';

        const textPrompt = `あなたは「第二言語習得論の専門家」兼「一流のアニメーション映画の作画監督」です。

【指示1: ストーリー作成】
- 言語: ${targetLang}
- レベル: ${level}
- テーマ: ${topic}
- ルール: ${lengthPrompt}。自然な日常描写のみ。
- 【絶対禁止】ストーリー本文中に年齢（例: "I am 25 years old", "twenty-five years old" など）や定型自己紹介を一切書かないこと。

【指示2: 作画監督プロンプト生成 (Animagine XL用タグ)】
作成したストーリーの内容を深く読み取り、その情景を最も的確に表すDanbooru形式の英語タグ列を作成してください。

[登場人物・出演者の調整ルール]
- ストーリーの文脈に合わせて出演人数と構成を柔軟に調整してください。
  * 主人公単独のシーン: "1boy, solo, 25yo adult Japanese male, neat black short hair"
  * 会話・他者とのやりとりがあるシーン: 相手も含めて描写（例: "2boys" / "1boy, 1girl, barista" / "multiple people, crowd"）
  * 人物が登場しない情景・物・風景が主題のシーン: "no humans, scenery"
  * 主人公以外の人物が主体のシーン: その人物に焦点を当てて描写
- 25歳の男性主人公を描く場合は、大人の青年（adult male, 25yo）として描写すること。
- ストーリーに子供の明示的な指定がない場合は、子供キャラクターを描かないこと。

[タグの構成要件]
1. 出演者タグ
2. 動作・ポーズ・表情タグ
3. 背景・場所タグ
4. 演出・照明タグ（anime screencap, cinematic lighting, sunlight, depth of field）
※禁止要素: child (ストーリー指定時除く), chibi, sweat drops, sparkles, manga symbols, text, watermark

以下の形式（JSON）のみを出力してください:
{
  "story": "ターゲット言語で書いた自然なストーリー本文",
  "director_tags": "出演者タグ, 動作タグ, 背景タグ, 演出照明タグ（カンマ区切り）"
}`;

        // 確実に応答するGeminiモデルリスト
        const models = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-2.0-flash'];
        let generatedStory = '';
        let directorTags = '';
        let isSuccess = false;
        let lastErr = '';

        for (const model of models) {
          try {
            setStatus(`Gemini (${model}) でストーリー生成中...`);
            const endpoint = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){model}:generateContent?key=${apiKey}`;
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: textPrompt }] }]
              })
            });

            const data = await res.json();
            if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
              let rawText = data.candidates[0].content.parts[0].text.trim();
              // Markdownの ```json 枠を安全に除去
              rawText = rawText.replace(/```json\n?/gi, '').replace(/```\n?/g, '').trim();

              try {
                const parsed = JSON.parse(rawText);
                generatedStory = parsed.story;
                directorTags = parsed.director_tags;
              } catch (parseErr) {
                generatedStory = rawText;
                directorTags = topic;
              }

              document.getElementById('resultText').value = generatedStory.trim();
              isSuccess = true;
              break;
            } else if (data.error) {
              lastErr = `[${model}] ${data.error.message}`;
            }
          } catch (netErr) {
            lastErr = `[${model}] ${netErr.message}`;
          }
        }

        if (!isSuccess) {
          throw new Error(`文章生成に失敗しました。\n${lastErr}`);
        }

        // 画像生成フェーズ
        setStatus('情景イラストを作画中...');
        btn.innerHTML = '<span class="animate-spin">🎨</span> 作画レンダリング中...';

        const fullPrompt = `masterpiece, newest, absurdres, highres, anime screencap, cinematic lighting, ${directorTags || topic}`;
        const negativePrompt = 'nsfw, lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name, chibi, sweat drops, manga symbols, sparkles, speech bubble, comic lines';

        if (hfToken) {
          try {
            const hfRes = await fetch('https://router.huggingface.co/hf-inference/models/cagliostrolab/animagine-xl-3.1', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${hfToken}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                inputs: fullPrompt,
                parameters: {
                  negative_prompt: negativePrompt,
                  width: 768,
                  height: 576,
                  guidance_scale: 7.0,
                  num_inference_steps: 28
                }
              })
            });

            if (hfRes.ok) {
              const blob = await hfRes.blob();
              imgElem.src = URL.createObjectURL(blob);
              imgContainer.classList.remove('hidden');
            } else {
              throw new Error(`HFコード: ${hfRes.status}`);
            }
          } catch (hfErr) {
            // HF失敗時はPollinationsにフォールバック
            const seed = Math.floor(Math.random() * 100000);
            imgElem.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=576&model=flux&nologo=true&seed=${seed}`;
            imgContainer.classList.remove('hidden');
          }
        } else {
          const seed = Math.floor(Math.random() * 100000);
          imgElem.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=576&model=flux&nologo=true&seed=${seed}`;
          imgContainer.classList.remove('hidden');
        }

        setStatus('');
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>✨</span> ストーリー＆情景イラストを生成';
      }
    }

    // 音声再生
    async function handleSpeak() {
      const text = document.getElementById('resultText').value.trim();
      if (!text) {
        showError('先にストーリーを生成するか、文章を入力してください。');
        return;
      }

      stopSpeech();

      const engine = document.getElementById('ttsEngine').value;
      const rawLang = document.getElementById('lang').value;
      const rate = parseFloat(document.getElementById('speechRate').value);
      const playBtn = document.getElementById('playBtn');

      playBtn.disabled = true;
      playBtn.innerHTML = '<span class="animate-spin">⏳</span> 音声準備中...';

      try {
        if (engine === 'gfunc') {
          const gFuncUrl = document.getElementById('gFuncUrl').value.trim();
          if (!gFuncUrl) throw new Error('Google TTS サーバーURLが未設定です。「⚙️ API・接続設定」に入力してください。');

          const response = await fetch(gFuncUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, langCode: rawLang, rate })
          });

          if (!response.ok) throw new Error(`サーバーエラー: ${response.status}`);
          const blob = await response.blob();
          await playBlobAudio(blob, 1.0);

        } else if (engine === 'elevenlabs') {
          const elevenKey = document.getElementById('elevenKey').value.trim().replace(/^["']|["']$/g, '');
          if (!elevenKey) throw new Error('ElevenLabsのAPIキーが未入力です。');

          const voiceId = "JBFqnCBsd6RMkjVDRZzb";
          const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
            method: 'POST',
            headers: {
              'xi-api-key': elevenKey,
              'Content-Type': 'application/json',
              'Accept': 'audio/mpeg'
            },
            body: JSON.stringify({
              text: text,
              model_id: "eleven_multilingual_v2",
              voice_settings: { stability: 0.5, similarity_boost: 0.8 }
            })
          });

          if (!response.ok) throw new Error(`ElevenLabsエラー: ${response.status}`);
          const blob = await response.blob();
          await playBlobAudio(blob, rate);

        } else {
          playBrowserVoice(text, rawLang, rate);
        }

      } catch (err) {
        showError(`【音声再生エラー】\n${err.message}\n\n※端末標準音声で再生します。`);
        playBrowserVoice(text, rawLang, rate);
      } finally {
        playBtn.disabled = false;
        playBtn.innerHTML = '<span>▶</span> 音声再生';
      }
    }

    function playBlobAudio(blob, playbackRate = 1.0) {
      return new Promise((resolve, reject) => {
        const audioUrl = URL.createObjectURL(blob);
        activeAudio = new Audio(audioUrl);
        activeAudio.playbackRate = playbackRate;
        activeAudio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          resolve();
        };
        activeAudio.onerror = () => {
          URL.revokeObjectURL(audioUrl);
          reject(new Error('オーディオの再生に失敗しました。'));
        };
        activeAudio.play().catch(reject);
      });
    }

    function playBrowserVoice(text, langCode, rate) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = rate;

      const voices = window.speechSynthesis.getVoices();
      const matchedVoice = voices.find(v => v.lang === langCode || v.lang.startsWith(langCode.split('-')[0]));
      if (matchedVoice) {
        u.voice = matchedVoice;
      }

      window.speechSynthesis.speak(u);
    }

    function stopSpeech() {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      window.speechSynthesis.cancel();
    }
  </script>
</body>
