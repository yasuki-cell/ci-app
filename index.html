<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Language Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-5">
    <h1 class="text-xl font-bold text-slate-900 mb-1">🌱 CI 言語学習アプリ</h1>
    <p class="text-xs text-slate-500 mb-4">Gemini API × 音声読み上げ（スマホ対応版）</p>

    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Gemini API Key:</label>
      <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border rounded-lg p-2 text-xs bg-slate-50">
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">言語:</label>
        <select id="lang" class="w-full border rounded-lg p-2 text-xs bg-slate-50">
          <option value="en-US">英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="es-ES">スペイン語</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">レベル:</label>
        <select id="level" class="w-full border rounded-lg p-2 text-xs bg-slate-50">
          <option value="A1 (入門・超基礎)">入門 (A1)</option>
          <option value="A2 (初級・日常)">初級 (A2)</option>
          <option value="B1 (中級)">中級 (B1)</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <input id="topic" type="text" placeholder="テーマ（例: 朝のコーヒー、散歩）" class="w-full border rounded-lg p-2 text-xs mb-2">
      <button onclick="generateContent()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-xs transition">
        ✨ AIストーリーを生成
      </button>
    </div>

    <textarea id="resultText" rows="5" class="w-full border rounded-lg p-3 text-xs leading-relaxed mb-3" placeholder="生成されたテキストがここに表示されます..."></textarea>

    <div class="flex gap-2">
      <button onclick="speakText()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-xs">
        ▶ 音声再生
      </button>
      <button onclick="stopSpeech()" class="bg-slate-200 text-slate-700 font-medium px-4 py-2 rounded-lg text-xs">
        停止
      </button>
    </div>
  </div>

  <script>
    async function generateContent() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert('Gemini APIキーを入力してください');

      const langSelect = document.getElementById('lang');
      const targetLang = langSelect.options[langSelect.selectedIndex].text;
      const level = document.getElementById('level').value;
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';
      const btn = document.getElementById('genBtn');

      btn.disabled = true;
      btn.innerText = '生成中...';

      const prompt = `あなたは第二言語習得論（CI）の専門家です。以下の条件で、情景が目に浮かぶ短い文章を作成してください。
言語: ${targetLang}
難易度: ${level}（易しい語彙）
テーマ: ${topic}
※解説や日本語訳は書かず、ターゲット言語の80〜120語程度のテキストのみを出力してください。`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        const text = data.candidates[0].content.parts[0].text;
        document.getElementById('resultText').value = text;
      } catch (e) {
        alert('エラーが発生しました。APIキーを確認してください。');
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ AIストーリーを生成';
      }
    }

    function speakText() {
      const text = document.getElementById('resultText').value;
      if (!text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = document.getElementById('lang').value;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
