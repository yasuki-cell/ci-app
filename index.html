<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Language Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 sm:p-5">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow border border-slate-200 p-4 sm:p-5 space-y-4">
    
    <!-- ヘッダー -->
    <div>
      <h1 class="text-lg font-bold text-slate-900">🌱 CI 言語学習アプリ</h1>
      <p class="text-xs text-slate-500">Grok 画像生成 × Gemini × 米国肉声</p>
    </div>

    <!-- エラー・通知表示 -->
    <div id="msgBox" class="hidden p-3 rounded-lg text-xs font-mono leading-relaxed break-words whitespace-pre-wrap"></div>

    <!-- 設定エリア -->
    <details class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs">
      <summary class="font-bold text-slate-700 cursor-pointer select-none">
        ⚙️ APIキー・サーバー設定
      </summary>
      <div class="space-y-3 mt-3 pt-2 border-t border-slate-200">
        <div>
          <label class="block font-semibold mb-1 text-slate-600">1. Gemini API Key (必須):</label>
          <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border border-slate-300 rounded p-2 text-xs bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-600">2. Grok (xAI) API Key (画像生成・任意):</label>
          <input id="xaiKey" type="password" placeholder="xai-..." class="w-full border border-slate-300 rounded p-2 text-xs bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-600">3. Google TTS サーバーURL (任意):</label>
          <input id="gFuncUrl" type="url" placeholder="https://...cloudfunctions.net/tts" class="w-full border border-slate-300 rounded p-2 text-xs bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-600">4. ElevenLabs API Key (米国肉声音声・任意):</label>
          <input id="elevenKey" type="password" placeholder="sk_..." class="w-full border border-slate-300 rounded p-2 text-xs bg-white font-mono">
        </div>
      </div>
    </details>

    <!-- 学習設定 -->
    <div class="grid grid-cols-3 gap-2 text-xs">
      <div>
        <label class="block font-semibold text-slate-600 mb-1">言語</label>
        <select id="lang" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="en-US">英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="my-MM">ミャンマー語</option>
          <option value="es-ES">スペイン語</option>
          <option value="de-DE">ドイツ語</option>
          <option value="ko-KR">韓国語</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-600 mb-1">レベル</label>
        <select id="level" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="A1">入門 (A1)</option>
          <option value="A2">初級 (A2)</option>
          <option value="B1">中級 (B1)</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-600 mb-1">長さ</label>
        <select id="length" class="w-full border border-slate-300 rounded p-1.5 bg-slate-50">
          <option value="short">短め (4文構成)</option>
          <option value="medium" selected>標準 (6〜8文構成)</option>
          <option value="long">長め (10〜12文構成)</option>
        </select>
      </div>
    </div>

    <!-- テーマ入力 & 生成ボタン -->
    <div class="space-y-2">
      <input id="topic" type="text" placeholder="テーマ（例: カフェで注文、駅のホーム、雨の日の出来事）" class="w-full border border-slate-300 rounded p-2 text-xs">
      <button id="genBtn" onclick="runGenerate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded text-xs transition shadow">
        ✨ 4シーン連動ストーリー＆Grokイラスト生成
      </button>
    </div>

    <!-- 4シーン イラストギャラリー（2x2グリッド） -->
    <div id="imgWrap" class="hidden space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-700">ストーリー絵巻 (4 Scenes):</span>
        <span id="imgEngineBadge" class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded">Grok Powered</span>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <!-- Scene 1 -->
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">1. 発端</span>
            <img id="sceneImg1" src="" alt="Scene 1" class="w-full h-full object-cover">
          </div>
          <p id="caption1" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>

        <!-- Scene 2 -->
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">2. 展開</span>
            <img id="sceneImg2" src="" alt="Scene 2" class="w-full h-full object-cover">
          </div>
          <p id="caption2" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>

        <!-- Scene 3 -->
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">3. クライマックス</span>
            <img id="sceneImg3" src="" alt="Scene 3" class="w-full h-full object-cover">
          </div>
          <p id="caption3" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>

        <!-- Scene 4 -->
        <div class="space-y-1">
          <div class="w-full aspect-[4/3] bg-slate-900 rounded-lg overflow-hidden border border-slate-200 shadow-sm relative flex items-center justify-center">
            <span class="absolute top-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">4. 結末</span>
            <img id="sceneImg4" src="" alt="Scene 4" class="w-full h-full object-cover">
          </div>
          <p id="caption4" class="text-[10px] text-slate-500 line-clamp-1 h-3.5"></p>
        </div>
      </div>
    </div>

    <!-- ストーリー表示 -->
    <div class="space-y-1">
      <span class="text-xs font-semibold text-slate-600">生成ストーリー全文:</span>
      <textarea id="storyText" rows="4" class="w-full border border-slate-300 rounded p-2.5 text-xs leading-relaxed" placeholder="ここにストーリーが表示されます..."></textarea>
    </div>

    <!-- 音声パネル -->
    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-2.5">
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">音声エンジン</label>
          <select id="ttsEngine" class="w-full border border-slate-300 rounded p-1.5 bg-white">
            <option value="elevenlabs" selected>ElevenLabs (米国肉声)</option>
            <option value="browser">端末標準 (無料・安定)</option>
            <option value="gfunc">Google TTS (サーバー)</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">再生速度</label>
          <select id="speechRate" class="w-full border border-slate-300 rounded p-1.5 bg-white">
            <option value="0.7">0.7x (超ゆっくり)</option>
            <option value="0.85">0.85x (ゆっくり)</option>
            <option value="1.0" selected>1.0x (標準)</option>
            <option value="1.15">1.15x (少し速め)</option>
            <option value="1.3">1.3x (高速)</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="playBtn" onclick="runSpeech()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs transition shadow">
          ▶ 音声再生
        </button>
        <button onclick="stopAudio()" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium px-4 py-2 rounded text-xs transition">
          停止
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentAudio = null;

    window.addEventListener('load', () => {
      const load = (id, key) => {
        const val = localStorage.getItem(key);
        if (val) document.getElementById(id).value = val;
      };
      load('apiKey', 'ci_gemini_key');
      load('xaiKey', 'ci_xai_key');
      load('gFuncUrl', 'ci_gfunc_url');
      load('elevenKey', 'ci_eleven_key');
    });

    function showMsg(text, isError = false) {
      const box = document.getElementById('msgBox');
      if (!text) {
        box.classList.add('hidden');
        return;
      }
      box.innerText = text;
      box.className = `p-3 rounded-lg text-xs leading-relaxed break-words whitespace-pre-wrap ${
        isError ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'
      }`;
      box.classList.remove('hidden');
    }

    // ストーリー＆4シーン連動イラスト生成
    async function runGenerate() {
      const btn = document.getElementById('genBtn');
      const apiKey = document.getElementById('apiKey').value.trim();
      const xaiKey = document.getElementById('xaiKey').value.trim();
      const gFuncUrl = document.getElementById('gFuncUrl').value.trim();
      const elevenKey = document.getElementById('elevenKey').value.trim();

      if (!apiKey) {
        showMsg('【エラー】Gemini APIキーを入力してください（⚙️ 設定欄）。', true);
        return;
      }

      localStorage.setItem('ci_gemini_key', apiKey);
      if (xaiKey) localStorage.setItem('ci_xai_key', xaiKey);
      if (gFuncUrl) localStorage.setItem('ci_gfunc_url', gFuncUrl);
      if (elevenKey) localStorage.setItem('ci_eleven_key', elevenKey);

      const langSelect = document.getElementById('lang');
      const targetLang = langSelect.options[langSelect.selectedIndex].text;
      const level = document.getElementById('level').value;
      const lengthChoice = document.getElementById('length').value;
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';

      let lengthDesc = '6〜8文の自然なパラグラフ';
      if (lengthChoice === 'short') lengthDesc = '4文構成の短いパラグラフ';
      if (lengthChoice === 'long') lengthDesc = '10〜12文構成のしっかりとしたパラグラフ';

      btn.disabled = true;
      btn.innerText = '⏳ 4シーン設計中...';
      showMsg('Gemini でストーリー＆4つの情景プロンプトを作成中...');

      const prompt = `あなたは「第二言語習得論の専門家」兼「一流アニメーション映画の作画監督」です。

【指示1: ストーリー作成】
- 言語: ${targetLang}
- レベル: ${level}
- テーマ: ${topic}
- 長さ: ${lengthDesc}
- 【禁止】本文中に年齢（例: "I am 25..."）や定型自己紹介を書かないこと。自然な日常ストーリーのみ。

【指示2: 4つのシーン作画プロンプト作成 (Grok / Image Generation用)】
ストーリーの最初から最後までを起承転結の4つの連続した情景（Scene 1〜4）に分割し、Grokで美麗な日本アニメ調イラストを生成するための詳細な英語プロンプトと、短い日本語説明を作成してください。

[作画ルール]
- スタイル: Beautiful modern Japanese anime film style, Makoto Shinkai aesthetic, cinematic lighting, ultra-detailed
- 出演者: ストーリーの文脈に合わせて柔軟に調整（1人、複数人、人物なし scenery など）。男性主人公を描く時は25歳大人の男性。
- 各シーンの動作・背景・光の陰影を詳細に記述。

必ず以下のJSON形式のみで出力してください:
{
  "story": "ストーリー本文全文",
  "scenes": [
    { "caption": "Scene 1の日本語説明", "prompt": "Scene 1用の詳細な英語プロンプト" },
    { "caption": "Scene 2の日本語説明", "prompt": "Scene 2用の詳細な英語プロンプト" },
    { "caption": "Scene 3の日本語説明", "prompt": "Scene 3用の詳細な英語プロンプト" },
    { "caption": "Scene 4の日本語説明", "prompt": "Scene 4用の詳細な英語プロンプト" }
  ]
}`;

      let story = '';
      let scenes = [];
      let isSuccess = false;
      let lastErr = '';

      const candidateModels = [
        'gemini-3.6-flash',
        'gemini-3.7-flash',
        'gemini-3.5-flash-lite'
      ];

      for (const model of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          const data = await res.json();
          if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            let raw = data.candidates[0].content.parts[0].text;
            raw = raw.replace(/```json\n?/gi, '').replace(/```\n?/g, '').trim();

            try {
              const parsed = JSON.parse(raw);
              story = parsed.story;
              scenes = Array.isArray(parsed.scenes) ? parsed.scenes : [];
            } catch {
              story = raw;
            }

            document.getElementById('storyText').value = story.trim();
            isSuccess = true;
            break;
          } else if (data.error) {
            lastErr = `[${model}] ${data.error.message}`;
          }
        } catch (netErr) {
          lastErr = `[${model}] ${netErr.message}`;
        }
      }

      if (!isSuccess) {
        showMsg(`【エラー】文章生成に失敗しました。\n${lastErr}`, true);
        btn.disabled = false;
        btn.innerText = '✨ 4シーン連動ストーリー＆Grokイラスト生成';
        return;
      }

      // 4シーン補完
      const fallbackCaptions = ["1. 発端の情景", "2. 出来事の展開", "3. クライマックス", "4. 結末の情景"];
      const fullScenes = [];
      for (let i = 0; i < 4; i++) {
        if (scenes[i] && (scenes[i].prompt || scenes[i].tags)) {
          fullScenes.push({
            caption: scenes[i].caption || fallbackCaptions[i],
            prompt: scenes[i].prompt || scenes[i].tags
          });
        } else {
          fullScenes.push({
            caption: fallbackCaptions[i],
            prompt: `anime style, ${topic}, highres, cinematic lighting, scene ${i + 1}`
          });
        }
      }

      showMsg('4枚のシーンイラストを描画中...');
      document.getElementById('imgWrap').classList.remove('hidden');

      const badge = document.getElementById('imgEngineBadge');
      if (xaiKey) {
        badge.innerText = 'Grok (xAI) Engine';
      } else {
        badge.innerText = 'Flux HD Engine';
      }

      const baseSeed = Math.floor(Math.random() * 800000);

      // Grok (xAI) または Flux による描画
      const loadSceneImage = async (scene, index) => {
        const imgElem = document.getElementById(`sceneImg${index + 1}`);
        const capElem = document.getElementById(`caption${index + 1}`);
        capElem.innerText = scene.caption;

        const finalPrompt = `Japanese anime screencap, masterpiece, 8k, cinematic lighting, ${scene.prompt}`;

        // 1. Grok API キーがある場合
        if (xaiKey) {
          try {
            const grokRes = await fetch('https://api.x.ai/v1/images/generations', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${xaiKey}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'grok-2-image',
                prompt: finalPrompt,
                n: 1,
                response_format: 'url'
              })
            });

            if (grokRes.ok) {
              const grokData = await grokRes.json();
              if (grokData.data?.[0]?.url) {
                imgElem.src = grokData.data[0].url;
                return;
              } else if (grokData.data?.[0]?.b64_json) {
                imgElem.src = `data:image/png;base64,${grokData.data[0].b64_json}`;
                return;
              }
            }
          } catch (e) {
            console.warn('Grok API fallback to Flux:', e);
          }
        }

        // 2. フォールバック (Flux / Pollinations)
        const seed = baseSeed + (index * 137);
        imgElem.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=768&height=576&model=flux&enhance=true&nologo=true&seed=${seed}`;
      };

      await Promise.all(fullScenes.map((s, idx) => loadSceneImage(s, idx)));

      showMsg('');
      btn.disabled = false;
      btn.innerText = '✨ 4シーン連動ストーリー＆Grokイラスト生成';
    }

    // 音声再生（ElevenLabs: 米国ナレーション音声 Adam）
    async function runSpeech() {
      const text = document.getElementById('storyText').value.trim();
      if (!text) {
        showMsg('先にストーリーを生成してください。', true);
        return;
      }

      stopAudio();
      const engine = document.getElementById('ttsEngine').value;
      const langCode = document.getElementById('lang').value;
      const rate = parseFloat(document.getElementById('speechRate').value);
      const playBtn = document.getElementById('playBtn');

      playBtn.disabled = true;
      playBtn.innerText = '⏳ 準備中...';

      try {
        if (engine === 'gfunc') {
          const gFuncUrl = document.getElementById('gFuncUrl').value.trim();
          if (!gFuncUrl) throw new Error('Google TTS サーバーURLが未設定です。');

          const res = await fetch(gFuncUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, langCode, rate })
          });
          if (!res.ok) throw new Error('サーバーエラー: ' + res.status);
          const blob = await res.blob();
          await playBlob(blob, 1.0);

        } else if (engine === 'elevenlabs') {
          const elevenKey = document.getElementById('elevenKey').value.trim();
          if (!elevenKey) throw new Error('ElevenLabs APIキーが未設定です。');

          const americanVoiceId = "pNInz6obpgDQGcFmaJgB"; // Adam (米国標準)

          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${americanVoiceId}`, {
            method: 'POST',
            headers: { 'xi-api-key': elevenKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text,
              model_id: 'eleven_multilingual_v2',
              voice_settings: { stability: 0.5, similarity_boost: 0.8 }
            })
          });
          if (!res.ok) throw new Error('ElevenLabs通信エラー: ' + res.status);
          const blob = await res.blob();
          await playBlob(blob, rate);

        } else {
          // 端末標準音声
          const u = new SpeechSynthesisUtterance(text);
          u.lang = langCode;
          u.rate = rate;
          const voices = window.speechSynthesis.getVoices();
          const match = voices.find(v => v.lang === langCode || v.lang.startsWith(langCode.split('-')[0]));
          if (match) u.voice = match;
          window.speechSynthesis.speak(u);
        }
      } catch (err) {
        showMsg('【音声エラー】' + err.message + '\n※端末標準音声で再生します。', true);
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langCode;
        u.rate = rate;
        window.speechSynthesis.speak(u);
      } finally {
        playBtn.disabled = false;
        playBtn.innerText = '▶ 音声再生';
      }
    }

    function playBlob(blob, playbackRate = 1.0) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        currentAudio.playbackRate = playbackRate;
        currentAudio.onended = () => { URL.revokeObjectURL(url); resolve(); };
        currentAudio.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
        currentAudio.play().catch(reject);
      });
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
