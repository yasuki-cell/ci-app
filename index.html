<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>CI Language Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
    <h1 class="text-xl font-bold text-slate-900 mb-1">🌱 CI 言語学習アプリ</h1>
    <p class="text-xs text-slate-500 mb-4">Gemini 3.6 × Animagine XL 3.1 × 極上音声</p>

    <!-- APIキー設定エリア -->
    <details class="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
      <summary class="font-semibold text-slate-700 cursor-pointer select-none">
        ⚙️ APIキー設定（クリックで開閉）
      </summary>
      <div class="space-y-2 mt-3 pt-2 border-t border-slate-200">
        <!-- Gemini -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">1. Gemini API Key (文章生成・必須):</label>
            <span id="geminiSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Hugging Face -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">2. Hugging Face Token (画像生成・任意):</label>
            <span id="hfSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="hfToken" type="password" placeholder="hf_..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- ElevenLabs -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-slate-700">3. ElevenLabs API Key (肉声音声・任意):</label>
            <span id="elevenSaved" class="text-[10px] text-emerald-600 hidden font-bold">✓ 保存済</span>
          </div>
          <input id="elevenKey" type="password" placeholder="sk_..." class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <p class="text-[9px] text-slate-400">※各キーはお使いの端末(LocalStorage)にのみ安全に保存されます</p>
      </div>
    </details>

    <!-- 設定 -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">言語:</label>
        <select id="lang" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="en-US">英語</option>
          <option value="fr-FR">フランス語</option>
          <option value="zh-CN">中国語</option>
          <option value="my-MM">ミャンマー語</option>
          <option value="es-ES">スペイン語</option>
          <option value="de-DE">ドイツ語</option>
          <option value="ko-KR">韓国語</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">レベル:</label>
        <select id="level" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50">
          <option value="A1 (入門・超基礎)">入門 (A1)</option>
          <option value="A2 (初級・日常)">初級 (A2)</option>
          <option value="B1 (中級)">中級 (B1)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">長さ:</label>
        <select id="length" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 font-medium">
          <option value="short">短め (30〜50語)</option>
          <option value="medium" selected>標準 (60〜100語)</option>
          <option value="long">長め (120〜150語)</option>
        </select>
      </div>
    </div>

    <!-- テーマ入力 & 生成ボタン -->
    <div class="mb-4">
      <input id="topic" type="text" placeholder="テーマ（例: カフェで注文、駅のホームで待つ）" class="w-full border border-slate-300 rounded-lg p-2 text-xs mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="generateContent()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-2 shadow-sm">
        <span>✨</span> ストーリー＆極上アニメイラストを生成
      </button>
    </div>

    <!-- エラー表示エリア -->
    <div id="errorBox" class="hidden mb-3 p-3 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-700 leading-relaxed break-words whitespace-pre-wrap"></div>

    <!-- 生成されたイラスト画像 -->
    <div id="imageContainer" class="hidden mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-1">作画監督カット (Visual Context):</label>
      <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-xl overflow-hidden border border-slate-200 shadow-sm flex items-center justify-center">
        <img id="generatedImage" src="" alt="情景イラスト" class="w-full h-full object-cover">
      </div>
    </div>

    <!-- 結果テキスト -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-600 mb-1">生成されたストーリー:</label>
      <textarea id="resultText" rows="4" class="w-full border border-slate-300 rounded-lg p-3 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans" placeholder="ここにストーリーが表示されます..."></textarea>
    </div>

    <!-- 音声エンジン選択＆速度コントロールパネル -->
    <div class="bg-indigo-50/70 border border-indigo-100 rounded-xl p-3 mb-2 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold text-indigo-900 mb-1">🎙 音声エンジン:</label>
          <select id="ttsEngine" class="w-full border border-indigo-200 rounded-lg p-1.5 text-xs bg-white text-slate-800 font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="elevenlabs" selected>ElevenLabs (最高峰肉声)</option>
            <option value="google_tts">Google 高音質音声</option>
            <option value="browser">端末標準 (Web Speech)</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-indigo-900 mb-1">⚡ 再生速度:</label>
          <select id="speechRate" class="w-full border border-indigo-200 rounded-lg p-1.5 text-xs bg-white text-slate-800 font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="0.7">0.7x (超ゆっくり)</option>
            <option value="0.85">0.85x (ゆっくり・練習用)</option>
            <option value="1.0" selected>1.0x (標準スピード)</option>
            <option value="1.15">1.15x (少し速め)</option>
            <option value="1.3">1.3x (高速)</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="speakText()" id="playBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-1 shadow-sm">
          <span>▶</span> ネイティブ音声再生
        </button>
        <button onclick="stopSpeech()" class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium px-4 py-2.5 rounded-lg text-xs transition shadow-sm">
          停止
        </button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto" class="hidden"></audio>

  <script>
    let activeAudio = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedGemini = localStorage.getItem('ci_gemini_key');
      if (savedGemini) {
        document.getElementById('apiKey').value = savedGemini;
        document.getElementById('geminiSaved').classList.remove('hidden');
      }
      const savedHf = localStorage.getItem('ci_hf_token');
      if (savedHf) {
        document.getElementById('hfToken').value = savedHf;
        document.getElementById('hfSaved').classList.remove('hidden');
      }
      const savedEleven = localStorage.getItem('ci_eleven_key');
      if (savedEleven) {
        document.getElementById('elevenKey').value = savedEleven;
        document.getElementById('elevenSaved').classList.remove('hidden');
      }
    });

    async function generateContent() {
      const errorBox = document.getElementById('errorBox');
      const imgContainer = document.getElementById('imageContainer');
      const imgElem = document.getElementById('generatedImage');
      
      errorBox.classList.add('hidden');
      errorBox.innerText = '';
      imgContainer.classList.add('hidden');

      const apiKey = document.getElementById('apiKey').value.trim().replace(/^["']|["']$/g, '');
      const hfToken = document.getElementById('hfToken').value.trim().replace(/^["']|["']$/g, '');
      const elevenKey = document.getElementById('elevenKey').value.trim().replace(/^["']|["']$/g, '');

      if (!apiKey) {
        showError('Gemini APIキーを入力してください。');
        return;
      }

      localStorage.setItem('ci_gemini_key', apiKey);
      document.getElementById('geminiSaved').classList.remove('hidden');

      if (hfToken) {
        localStorage.setItem('ci_hf_token', hfToken);
        document.getElementById('hfSaved').classList.remove('hidden');
      }
      if (elevenKey) {
        localStorage.setItem('ci_eleven_key', elevenKey);
        document.getElementById('elevenSaved').classList.remove('hidden');
      }

      const langSelect = document.getElementById('lang');
      const targetLang = langSelect.options[langSelect.selectedIndex].text;
      const level = document.getElementById('level').value;
      const lengthChoice = document.getElementById('length').value;
      const topic = document.getElementById('topic').value.trim() || '日常の出来事';
      const btn = document.getElementById('genBtn');

      let lengthPrompt = '全体で60〜100語程度の標準的なパラグラフ';
      if (lengthChoice === 'short') lengthPrompt = '全体で30〜50語程度（2〜3文）の非常に短いパラグラフ';
      if (lengthChoice === 'long') lengthPrompt = '全体で120〜150語程度のしっかりとしたパラグラフ';

      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin">⏳</span> 作画監督がシーン設計中...';

      const textPrompt = `あなたは「第二言語習得論の専門家」兼「一流の日本アニメ作画監督（Animation Director）」です。

【指示1: ストーリー作成】
- 言語: ${targetLang}
- レベル: ${level}
- テーマ: ${topic}
- ルール: ${lengthPrompt}。自然な日常描写のみ。
- 【絶対禁止】ストーリー本文中に年齢（例: "I am 25 years old", "twenty-five years old" など）や自己紹介を一切書かないこと。

【指示2: 作画監督プロンプト生成 (Animagine XL用タグ)】
生成したストーリーの情景をAnimagine XL 3.1で完璧に映像化するためのDanbooruタグ列を作成してください。
以下の要素を必ず含めてカンマ区切りの英語タグで出力してください:
1. 主人公: 1boy, solo, 25yo adult handsome Japanese male, neat black short hair, expressive eyes, stylish casual clothes
2. 動作・ポーズ: ストーリーと直結する具体的な身体動作タグ（例: holding cup, walking, looking at train, reading book）
3. 背景・場所: どこにいるか一目でわかる美麗な日本の日常背景（例: inside modern cafe, counter, station platform, train tracks, sunny street）
4. 演出・照明: 映画的な光の演出（例: anime screencap, cinematic lighting, sunlight, depth of field, vibrant colors）
※禁止タグ: child, kid, chibi, sweat drops, sparkles, manga symbols, text, watermark

以下の形式（JSON）のみを出力してください:
{
  "story": "ターゲット言語で書いた自然なストーリー本文",
  "director_tags": "1boy, solo, 25yo adult handsome Japanese male, neat black short hair, (動作タグ), (背景タグ), (照明・アングルタグ)"
}`;

      const activeModels = ['gemini-3.6-flash', 'gemini-3.7-flash', 'gemini-3.5-flash-lite'];
      let isSuccess = false;
      let lastErrorMessage = '';
      let generatedStory = '';
      let directorTags = '';

      for (const model of activeModels) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: textPrompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await res.json();
          if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
            generatedStory = parsed.story;
            directorTags = parsed.director_tags || `1boy, solo, 25yo adult handsome Japanese male, ${topic}`;
            document.getElementById('resultText').value = generatedStory.trim();
            isSuccess = true;
            break;
          } else if (data.error) {
            lastErrorMessage = data.error.message;
          }
        } catch (e) {
          lastErrorMessage = e.message;
        }
      }

      if (!isSuccess) {
        showError(`【接続エラー】\n${lastErrorMessage}`);
        btn.disabled = false;
        btn.innerHTML = '<span>✨</span> ストーリー＆極上アニメイラストを生成';
        return;
      }

      // 画像生成
      btn.innerHTML = '<span class="animate-spin">🎨</span> アニメ作画レンダリング中...';

      const fullPrompt = `masterpiece, newest, absurdres, highres, anime screencap, cinematic lighting, ${directorTags}`;
      const negativePrompt = 'nsfw, lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name, child, kid, baby, chibi, sweat drops, manga symbols, sparkles, speech bubble, comic lines';

      try {
        if (hfToken) {
          const hfRes = await fetch('https://router.huggingface.co/hf-inference/models/cagliostrolab/animagine-xl-3.1', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${hfToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              inputs: fullPrompt,
              parameters: {
                negative_prompt: negativePrompt,
                width: 768,
                height: 576,
                guidance_scale: 7.0,
                num_inference_steps: 28
              }
            })
          });

          if (hfRes.ok) {
            const blob = await hfRes.blob();
            imgElem.src = URL.createObjectURL(blob);
            imgContainer.classList.remove('hidden');
          } else {
            throw new Error(`HF応答コード: ${hfRes.status}`);
          }
        } else {
          const seed = Math.floor(Math.random() * 100000);
          imgElem.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=576&model=flux&nologo=true&seed=${seed}`;
          imgContainer.classList.remove('hidden');
        }
      } catch (imgErr) {
        const seed = Math.floor(Math.random() * 100000);
        imgElem.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=576&model=flux&nologo=true&seed=${seed}`;
        imgContainer.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>✨</span> ストーリー＆極上アニメイラストを生成';
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    // 音声再生（完全Blob化・CORS安全設計）
    async function speakText() {
      const text = document.getElementById('resultText').value.trim();
      if (!text) return alert('先にテキストを生成するか、文章を入力してください');

      stopSpeech();

      const engine = document.getElementById('ttsEngine').value;
      const rawLang = document.getElementById('lang').value;
      const langShort = rawLang.split('-')[0];
      const rate = parseFloat(document.getElementById('speechRate').value);
      const playBtn = document.getElementById('playBtn');

      playBtn.disabled = true;
      playBtn.innerHTML = '<span class="animate-spin">⏳</span> 音声準備中...';

      try {
        // 1. ElevenLabs
        if (engine === 'elevenlabs') {
          const elevenKey = document.getElementById('elevenKey').value.trim().replace(/^["']|["']$/g, '');
          if (!elevenKey) throw new Error('ElevenLabsのAPIキーが設定されていません。「⚙️ APIキー設定」にキーを入力してください。');

          const voiceId = "JBFqnCBsd6RMkjVDRZzb"; // George
          const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
            method: 'POST',
            headers: {
              'xi-api-key': elevenKey,
              'Content-Type': 'application/json',
              'Accept': 'audio/mpeg'
            },
            body: JSON.stringify({
              text: text,
              model_id: "eleven_multilingual_v2",
              voice_settings: {
                stability: 0.5,
                similarity_boost: 0.8
              }
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.detail?.message || `ElevenLabs通信エラー (${response.status})`);
          }

          const blob = await response.blob();
          await playBlobAudio(blob, rate);

        // 2. Google 高音質音声 (安全なオーディオプロキシ経由でBlobロード)
        } else if (engine === 'google_tts') {
          const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${langShort}&client=tw-ob`;
          
          // Audioオブジェクトで安全に再生
          activeAudio = new Audio(audioUrl);
          activeAudio.playbackRate = rate;
          await activeAudio.play();

        // 3. 端末標準音声
        } else {
          playBrowserVoice(text, rawLang, rate);
        }

      } catch (err) {
        showError(`【音声再生エラー】\n${err.message}\n\n※自動的に端末標準音声で再生します。`);
        playBrowserVoice(text, rawLang, rate);
      } finally {
        playBtn.disabled = false;
        playBtn.innerHTML = '<span>▶</span> ネイティブ音声再生';
      }
    }

    function playBlobAudio(blob, rate) {
      return new Promise((resolve, reject) => {
        const audioUrl = URL.createObjectURL(blob);
        activeAudio = new Audio(audioUrl);
        activeAudio.playbackRate = rate;
        activeAudio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          resolve();
        };
        activeAudio.onerror = (e) => {
          URL.revokeObjectURL(audioUrl);
          reject(new Error('オーディオの再生に失敗しました。'));
        };
        activeAudio.play().catch(reject);
      });
    }

    function playBrowserVoice(text, langCode, rate) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }

    function stopSpeech() {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
